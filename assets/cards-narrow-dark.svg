<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 1504" width="640" height="1504" role="img" aria-label="What I work on. Self-hosted AI: Speech recognition, language models, search and assistant tools on our own GPUs. 3D and computer vision: Photo-to-3D modelling, mesh repair for printing, and video analytics. Data and reporting: Scrapers, pipelines and dashboards for cost allocation and daily reporting. Workflow automation: Email triage, routing and task coordination, with people making the calls. Full-stack apps: Web and mobile apps for residents and staff. Reliability and security: Authentication, monitoring and hardened deployments for internal systems.">
  <style>
