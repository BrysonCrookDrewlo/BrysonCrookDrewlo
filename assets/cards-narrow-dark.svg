    .i3{animation-delay:0.56s}
    .i4{animation-delay:0.68s}
    .i5{animation-delay:0.80s}
    @keyframes draw{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}
    @media (prefers-reduced-motion:reduce){.i{animation:none}}
  </style>
