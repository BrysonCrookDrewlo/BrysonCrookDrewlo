<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 1386" width="640" height="1386" role="img" aria-label="What I work on. Self-hosted AI: Speech recognition, language models and assistant tools for company knowledge. Internal platforms: Containerized services that connect business systems through authenticated APIs. Data and reporting: Pipelines and dashboards for cost allocation and day-to-day reporting. Workflow automation: Email triage, routing and task coordination, with people making the calls. Full-stack apps: Web and mobile apps for residents and staff. Reliability and security: Authentication, monitoring and hardened deployments for internal systems.">
  <style>
    .t{font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif}
    .i{stroke-dasharray:1;animation:draw 1.1s cubic-bezier(.33,0,.2,1) both}
