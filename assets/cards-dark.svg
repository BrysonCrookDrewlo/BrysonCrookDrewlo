<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 593" width="1280" height="593" role="img" aria-label="What I work on. Self-hosted AI: Speech recognition, language models and assistant tools for everyday work. Internal platforms: Containerized services that connect business systems through authenticated APIs. Data and reporting: Pipelines and dashboards for cost allocation and day-to-day reporting. Workflow automation: Email triage, routing and task coordination, with people making the calls. Full-stack apps: Web and mobile apps for residents and staff, from database to interface. Reliability and security: Authentication, monitoring and hardened deployments for internal systems.">
  <style>
    .t{font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif}
