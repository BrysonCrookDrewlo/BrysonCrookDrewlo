<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 320" width="640" height="320" role="img" aria-label="Bryson Crook, Software Engineer at Drewlo Holdings">
  <style>
    .t{font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif}
    .grid{animation:appear .8s ease-out both}
    .b{stroke-dasharray:1;animation:draw 1.4s cubic-bezier(.33,0,.2,1) both}
    .b0{animation-delay:0.00s}
    .b1{animation-delay:0.15s}
    .b2{animation-delay:0.30s}
    .b3{animation-delay:0.45s}
    .b4{animation-delay:0.60s}
    .w{animation:appear .6s ease-out 1.5s both}
    @keyframes draw{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}
    @keyframes appear{from{opacity:0}to{opacity:1}}
    @media (prefers-reduced-motion:reduce){.grid,.b,.w{animation:none}}
  </style>
  <defs>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#4493f8" stroke-opacity="0.12" stroke-width="1"/>
    </pattern>
    <linearGradient id="artFade" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0.55" stop-color="#fff" stop-opacity="0"/>
      <stop offset="0.95" stop-color="#fff" stop-opacity="1"/>
    </linearGradient>
    <mask id="m"><rect width="640" height="320" fill="url(#artFade)"/></mask>
    <clipPath id="card"><rect width="640" height="320" rx="16"/></clipPath>
  </defs>
  <g clip-path="url(#card)">
    <rect width="640" height="320" fill="#151b23"/>
    <g mask="url(#m)">
      <rect class="grid" width="640" height="320" fill="url(#grid)"/>
      <g transform="translate(384 144) scale(0.55)" fill="none" stroke="#4493f8" stroke-width="1.5" stroke-opacity="0.6" stroke-linejoin="round">
        <path class="b b0" pathLength="1" d="M0 320V176h96v144"/>
        <path class="b b1" pathLength="1" d="M96 320V120h128v200"/>
        <path class="b b2" pathLength="1" d="M224 320V200h80v120"/>
        <path class="b b3" pathLength="1" d="M304 320V88h112v232"/>
        <path class="b b4" pathLength="1" d="M416 320V160h64"/>
        <path class="w" d="M24 200h16m16 0h16M24 232h16m16 0h16M24 264h16m16 0h16"/>
        <path class="w" d="M120 144h16m16 0h16m16 0h16M120 176h16m16 0h16m16 0h16M120 208h16m16 0h16m16 0h16M120 240h16m16 0h16m16 0h16M120 272h16m16 0h16m16 0h16"/>
        <path class="w" d="M240 224h16m16 0h16M240 256h16m16 0h16"/>
        <path class="w" d="M328 112h16m16 0h16m16 0h16M328 144h16m16 0h16m16 0h16M328 176h16m16 0h16m16 0h16M328 208h16m16 0h16m16 0h16M328 240h16m16 0h16m16 0h16M328 272h16m16 0h16m16 0h16"/>
      </g>
    </g>
    <rect x="40" y="72" width="40" height="4" rx="2" fill="#4493f8"/>
    <text class="t" x="40" y="148" font-size="64" font-weight="600" letter-spacing="-1" fill="#f0f6fc">Bryson Crook</text>
    <text class="t" x="40" y="192" font-size="28" fill="#9198a1">Software Engineer · Drewlo Holdings</text>
    <rect x="0.5" y="0.5" width="639" height="319" rx="16" fill="none" stroke="#3d444d"/>
  </g>
</svg>
