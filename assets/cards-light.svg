<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 536" width="1280" height="536" role="img" aria-label="What I work on. Self-hosted AI: Speech, language models and assistant tools running on our own hardware. Internal platforms: Containerized services that connect business systems through authenticated APIs. Data and reporting: Pipelines and dashboards for cost allocation and day-to-day reporting. Workflow automation: Email triage, routing and task coordination, with people making the calls. Full-stack apps: Web and mobile apps for residents and staff, from database to interface.">
  <style>
    .t{font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif}
    .i{stroke-dasharray:1;animation:draw 1.1s cubic-bezier(.33,0,.2,1) both}
    .i0{animation-delay:0.20s}
    .i1{animation-delay:0.32s}
    .i2{animation-delay:0.44s}
    .i3{animation-delay:0.56s}
    .i4{animation-delay:0.68s}
    @keyframes draw{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}
    @media (prefers-reduced-motion:reduce){.i{animation:none}}
  </style>
