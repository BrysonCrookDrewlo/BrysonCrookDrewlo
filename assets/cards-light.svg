<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 545" width="1280" height="545" role="img" aria-label="What I work on. Self-hosted AI: Speech recognition, language models and assistant tools for company knowledge. Internal platforms: Containerized services that connect business systems through authenticated APIs. Data and reporting: Pipelines and dashboards for cost allocation and day-to-day reporting. Workflow automation: Email triage, routing and task coordination, with people making the calls. Full-stack apps: Web and mobile apps for residents and staff. Reliability and security: Authentication, monitoring and hardened deployments for internal systems.">
  <style>
