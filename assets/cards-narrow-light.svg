<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 1462" width="640" height="1462" role="img" aria-label="What I work on. Self-hosted AI: Speech recognition and language models served on our own GPU. 3D and computer vision: Photogrammetry, AI-drawn CAD solids and mesh repair for 3D printing. Search and retrieval: Hybrid search with reranking, and answers that stream with their sources. Processing pipelines: GPU job queues with retries, from raw recordings and photos to results. Full-stack apps: React and Next.js front ends on FastAPI, with Microsoft sign-in. Reliability and security: Prompt-injection defences, no silent fallbacks, locked-down deployments.">
  <style>
    .t{font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif}
    .i{stroke-dasharray:1;animation:draw 1.1s cubic-bezier(.33,0,.2,1) both}
    .i0{animation-delay:0.20s}
    .i1{animation-delay:0.32s}
    .i2{animation-delay:0.44s}
    .i3{animation-delay:0.56s}
    .i4{animation-delay:0.68s}
    .i5{animation-delay:0.80s}
    @keyframes draw{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}
    @media (prefers-reduced-motion:reduce){.i{animation:none}}
  </style>
